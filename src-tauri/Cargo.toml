[package]
name = "navi"
version = "0.1.0"
description = "Navi - Lecteur de texte à voix haute 100% local"
authors = ["you"]
edition = "2024"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# CUDA actif par défaut (builds de livraison). La CI compile en `--no-default-features` : le runner
# n'a pas le CUDA Toolkit. shortcut: la voie CUDA n'est pas vérifiée en CI ; ajouter un job dédié
# (runner avec toolkit) si les régressions de build CUDA deviennent un risque.
default = ["cuda"]
cuda = ["whisper-rs/cuda"]

[patch.crates-io]
global-hotkey = { path = "patches/global-hotkey" }

[dependencies]
# "image-png" : décodage des PNG embarquées (anneaux d'état tray, N-050).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dirs = "5"

# Capture presse-papiers (Windows)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

# Raccourcis globaux
global-hotkey = "0.3"

# TTS (Kokoro via ONNX Runtime) — features par défaut : la binaire onnxruntime est
# téléchargée au build et embarquée (validée en Sprint 0). "load-dynamic" exige une
# onnxruntime.dll à l'exécution, absente par défaut → LoadLibraryExW échoue.
ort = "2.0.0-rc.15"
libloading = "0.9"

# Phonémisation (espeak-ng via libloading - déjà dans tts)

# Audio
rodio = "0.19"
# Capture micro (dictée, N-088) ; même version que celle déjà tirée par rodio.
cpal = "0.15"

# Transcription (dictée, N-090) : whisper.cpp compilé avec CUDA (CMake + CUDA Toolkit requis au build).
whisper-rs = "0.16"

# Téléchargement du modèle de dictée (N-094) ; déjà tirée par ort (ureq 3 dans Cargo.lock).
ureq = "3"

# Utilitaires
libc = "0.2"
# Empreintes SHA-256 des modèles (N-059) ; déjà présent dans Cargo.lock.
sha2 = "0.10"

# Tests
#[cfg(test)]
tempfile = "3"
zip = "9.7.0"
npyz = "0.9.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
