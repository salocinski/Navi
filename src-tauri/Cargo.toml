[package]
name = "navi"
version = "0.1.0"
description = "Navi - Lecteur de texte à voix haute 100% local"
authors = ["you"]
edition = "2024"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dirs = "5"

# Capture presse-papiers (Windows)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

# Raccourcis globaux
global-hotkey = "0.3"
once_cell = "1.19"

# TTS (Kokoro via ONNX Runtime)
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
libloading = "0.9"

# Phonémisation (espeak-ng via libloading - déjà dans tts)

# Audio
rodio = "0.19"

# Utilitaires
libc = "0.2"

# Tests
#[cfg(test)]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
