[package]
name = "navi"
version = "0.1.0"
description = "Navi - Lecteur de texte à voix haute 100% local"
authors = ["you"]
edition = "2024"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
global-hotkey = { path = "patches/global-hotkey" }

[dependencies]
# "image-png" : décodage des PNG embarquées (anneaux d'état tray, N-050).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dirs = "5"

# Capture presse-papiers (Windows)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

# Raccourcis globaux
global-hotkey = "0.3"

# TTS (Kokoro via ONNX Runtime) — features par défaut : la binaire onnxruntime est
# téléchargée au build et embarquée (validée en Sprint 0). "load-dynamic" exige une
# onnxruntime.dll à l'exécution, absente par défaut → LoadLibraryExW échoue.
ort = "2.0.0-rc.15"
libloading = "0.9"

# Phonémisation (espeak-ng via libloading - déjà dans tts)

# Audio
rodio = "0.19"

# Utilitaires
libc = "0.2"

# Tests
#[cfg(test)]
tempfile = "3"
zip = "9.7.0"
npyz = "0.9.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
